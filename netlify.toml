[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Security headers for every page and file on the site.
[[headers]]
  for = "/*"
  [headers.values]
    # Only run scripts and load files from this site (plus Google Fonts and
    # the OpenAlex paper search), so injected or third-party code can't run.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openalex.org; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    # Other sites can't show this game inside a frame (clickjacking).
    X-Frame-Options = "DENY"
    # Browsers must trust each file's declared type, not guess it.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The game never needs the camera, microphone, or location.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
