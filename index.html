<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Scholar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game">
      <input id="search-input" type="search" placeholder="Search papers..." autocomplete="off" hidden />
      <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden />
      <!-- Classmate feedback, laid over the game by FeedbackScene. Sent with fetch, never submitted. -->
      <form id="feedback-form" class="game-form" hidden novalidate>
        <h2>FEEDBACK</h2>
        <p class="note">Thanks for playing! Answer whatever you like.</p>
        <fieldset data-rating="fun"><legend>How fun was it?</legend></fieldset>
        <fieldset data-rating="learned"><legend>Did you learn something from the paper?</legend></fieldset>
        <fieldset data-rating="easy"><legend>Was it easy to figure out what to do?</legend></fieldset>
        <label>Best part?<textarea name="best" maxlength="300" rows="2"></textarea></label>
        <label>What was confusing or annoying?<textarea name="confusing" maxlength="300" rows="2"></textarea></label>
        <label>One thing you'd change?<textarea name="change" maxlength="300" rows="2"></textarea></label>
        <label>Your first name (optional)<input name="name" maxlength="40" autocomplete="off" /></label>
        <div class="actions">
          <button type="button" id="feedback-send">SEND</button>
          <button type="button" id="feedback-back">BACK</button>
        </div>
        <p id="feedback-status" role="status"></p>
      </form>
      <!-- Ask the Scholar's question box, laid over the game by AskScholarScene. -->
      <form id="ask-form" class="game-form" hidden novalidate>
        <label><span class="label-text">Your question</span><textarea name="question" maxlength="200" rows="2"></textarea></label>
        <div class="actions">
          <button type="button" id="ask-send">ASK</button>
          <button type="button" id="ask-done">DONE</button>
          <span id="ask-left"></span>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
